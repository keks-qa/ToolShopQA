name: Toolshop API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolshop-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      HEADLESS: "1"
      API_BASE_URL: "http://localhost:8091"
      UI_BASE_URL: "http://localhost:4200"

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Ukloni prethodni trace
        run: rm -f search_trace.zip

      - name: Preuzmi Toolshop aplikaciju
        uses: actions/checkout@v7
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - name: Pripremi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj dependencies
        run: python -m pip install requests playwright

      - name: Instaliraj Chrome i dependencies
        run: python -m playwright install --with-deps chrome

      - name: Pokreni i pripremi Toolshop
        id: prepare
        working-directory: toolshop-app
        run: |
          compose() {
            docker compose -f docker-compose.prod.yml "$@"
          }

          compose pull mariadb laravel-api angular-ui

          docker build \
            -t testsmith/practice-software-testing-web:latest \
            -f _docker/web.docker \
            _docker

          compose up --pull never -d mariadb laravel-api web angular-ui

          db_ready=0
          for attempt in {1..60}; do
            if compose exec -T laravel-api php -r \
              'new PDO("mysql:host=mariadb;dbname=toolshop", "user", "root");' \
              >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done

          test "$db_ready" -eq 1

          compose exec -T laravel-api php artisan migrate:fresh --seed --force

          for url in http://localhost:8091/products http://localhost:4200/; do
            echo "Proveravam dostupnost: $url"
            curl -fsS \
              --retry 90 \
              --retry-delay 2 \
              --retry-all-errors \
              --retry-max-time 240 \
              --connect-timeout 5 \
              --max-time 15 \
              --output /dev/null \
              "$url"
          done

      - name: Pokreni API testove
        run: python -u api_tests.py

      - name: Pokreni Playwright test
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: python -u playwright_mock_test.py

      - name: Dijagnostika Toolshopa
        if: failure()
        working-directory: toolshop-app
        run: |
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color --tail=80 web laravel-api angular-ui mariadb

      - name: Sacuvaj trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: search_trace.zip