name: Toolshop API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Pripremi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj dependencies
        run: python -m pip install requests

      - name: Pokreni API testove
        run: python -u api_tests.py
  playwright-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      HEADLESS: "1"
      UI_BASE_URL: "http://localhost:4200"

    steps:
      - uses: actions/checkout@v7

      - name: Ukloni prethodni trace
        run: rm -f search_trace.zip

      - name: Preuzmi Toolshop aplikaciju
        uses: actions/checkout@v7
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop-app

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj Playwright
        run: python -m pip install playwright

      - name: Instaliraj Chrome i dependencies
        run: python -m playwright install --with-deps chrome

      - name: Pokreni i pripremi Toolshop
        working-directory: toolshop-app
        run: |
          compose() {
            docker compose -f docker-compose.prod.yml "$@"
          }

          compose up --pull missing -d mariadb laravel-api web angular-ui

          db_ready=0
          for attempt in {1..60}; do
            if compose exec -T laravel-api php -r \
              'new PDO("mysql:host=mariadb;dbname=toolshop", "user", "root");' \
              >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done

          test "$db_ready" -eq 1

          compose exec -T laravel-api php artisan migrate:fresh --seed --force

          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused \
            http://localhost:8091/products >/dev/null

          curl -fsS --retry 90 --retry-delay 2 --retry-connrefused \
            http://localhost:4200/ >/dev/null

        
      - name: Dijagnostika Toolshopa
        if: failure()
        working-directory: toolshop-app
        run: |
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color --tail=80 web laravel-api

      - name: Pokreni Playwright test
        run: python -u playwright_mock_test.py

      - name: Sacuvaj trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: search_trace.zip