name: Toolshop API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7

      - name: Pripremi Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instaliraj dependencies
        run: python -m pip install requests

      - name: Pokreni API testove
        run: python -u api_tests.py